<!-- MODAL IKLAN -->
<div class="modal" id="adModal">
  <div class="modal-content">

    <div id="timer">15</div>
  </div>
</div>

<script>
const clickSound = new Audio('https://freesound.org/data/previews/522/522178_861714-lq.mp3');

function pasteLink() {
  navigator.clipboard.readText().then(text => {
    document.getElementById("tiktokUrl").value = text;
    playSound();
  }).catch(err => alert("Gagal menempel link: " + err.message));
}

function playSound() { try{ clickSound.play(); } catch(e){} }

document.getElementById("downloadBtn").addEventListener("click", function(){
  const url = document.getElementById("tiktokUrl").value.trim();
  if(!url.includes("tiktok.com")) return alert("Masukkan link TikTok yang valid");

  playSound();

  // Tampilkan modal + iklan
  document.getElementById("adModal").style.display = "block";
  document.getElementById("loading").style.display = "block";

  let t = 15;
  const interval = setInterval(() => {
    document.getElementById("timer").innerText = t;
    t--;
    if(t < 0){
      clearInterval(interval);
      document.getElementById("adModal").style.display = "none";
      document.getElementById("loading").style.display = "none";

      // --- POPUNDER / IKLAN MONETAG ---
      window.open("https://otieu.com/4/10391957", "_blank");

      // --- REDIRECT KE LINK Pihak Ketiga ---
      window.location.href = "https://snaptik.app/" + encodeURIComponent(url);
    }
  },1000);
});
</script>
